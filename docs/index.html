<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Preview sistem siklus akuntansi UMKM Aneka Snack.">
    <title>Aneka Snack — UMKM Accounting System</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
          <div><strong id="brandName">Aneka Snack</strong><span>Financial Reporting</span></div>
        </div>
        <nav class="side-nav" id="sideNav">
          <p class="nav-section-label">Ruang kerja</p>
          <button class="nav-item active" data-view="overview"><span>01</span>Dashboard</button>
          <p class="nav-section-label">Operasional</p>
          <button class="nav-item" data-view="sales"><span>02</span>Penjualan</button>
          <button class="nav-item" data-view="purchases"><span>03</span>Pembelian</button>
          <button class="nav-item" data-view="cashbank"><span>04</span>Kas &amp; Bank</button>
          <button class="nav-item" data-view="inventory"><span>05</span>Persediaan</button>
          <button class="nav-item" data-view="masterdata"><span>06</span>Master Barang</button>
          <p class="nav-section-label">Akuntansi</p>
          <button class="nav-item" data-view="ledger"><span>07</span>Buku Besar</button>
          <button class="nav-item" data-view="monthend"><span>08</span>Proses Akhir Bulan</button>
          <button class="nav-item" data-view="statements"><span>09</span>Laporan</button>
          <p class="nav-section-label">Sistem</p>
          <button class="nav-item" data-view="settings"><span>10</span>Pengaturan</button>
        </nav>
        <div class="sidebar-foot">
          <div class="local-note">
            <span class="local-dot" id="syncDot"></span>
            <div><strong id="syncTitle">Mode demo</strong><small id="syncDetail">Data contoh untuk preview</small></div>
          </div>
          <button class="text-button" id="resetButton">Muat ulang data contoh</button>
        </div>
      </aside>
      <div class="mobile-backdrop" id="mobileBackdrop"></div>
      <main class="main-area">
        <header class="topbar">
          <div class="topbar-left">
            <button class="menu-button" id="menuButton" aria-label="Buka menu" aria-expanded="false"><span></span><span></span><span></span></button>
            <div><p class="eyebrow" id="businessEyebrow">BANTUL, YOGYAKARTA · STUDI KASUS</p><h1 id="pageTitle">Dashboard</h1></div>
          </div>
          <div class="period-chip"><span>Periode</span><strong id="periodLabel">September 2026</strong></div>
        </header>
        <div id="app" class="content" tabindex="-1"></div>
      </main>
    </div>
    <dialog class="journal-dialog" id="journalDialog" aria-labelledby="journalDialogTitle"></dialog>
    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
